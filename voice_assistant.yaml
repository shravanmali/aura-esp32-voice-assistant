substitutions:
  name: "voice-assistant"
  friendly_name: "Voice Assistant"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - micro_wake_word.start:

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended

psram:
  mode: octal
  speed: 40MHz

wifi:
  power_save_mode: none
  networks:
    - ssid: !secret wifi_ssid_primary
      password: !secret wifi_password_primary
      priority: 10.0
    - ssid: !secret wifi_ssid_secondary
      password: !secret wifi_password_secondary
      priority: 5.0

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Voice Assistant Fallback"
    password: !secret wifi_fallback_password

captive_portal:

logger:
  hardware_uart: UART0
  level: INFO

api:

ota:
  - platform: esphome

button:
  - platform: template
    name: "Force Start Mic"
    id: force_start_mic
    on_press:
      - voice_assistant.start:
  - platform: template
    name: "Restart Wake Word"
    id: restart_wake_word
    on_press:
      - micro_wake_word.start:

i2s_audio:
  # Microphone I2S Bus
  - id: i2s_in
    i2s_lrclk_pin: GPIO15
    i2s_bclk_pin: GPIO16
  # Speaker I2S Bus
  - id: i2s_out
    i2s_lrclk_pin: GPIO6
    i2s_bclk_pin: GPIO5

microphone:
  - platform: i2s_audio
    id: board_mic
    i2s_audio_id: i2s_in
    adc_type: external
    i2s_din_pin: GPIO17
    pdm: false
    channel: left

speaker:
  - platform: i2s_audio
    id: board_speaker
    i2s_audio_id: i2s_out
    dac_type: external
    i2s_dout_pin: GPIO7
    buffer_duration: 300ms
    timeout: 1000ms

light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    pin: GPIO4
    num_leds: 8
    id: aura_led
    name: "Aura LED"
    chipset: ws2812
    default_transition_length: 0.15s
    effects:
      - addressable_rainbow:
          name: "Rainbow"
          speed: 10
          width: 50
      - addressable_color_wipe:
          name: "Thinking Wipe"
          colors:
            - red: 0%
              green: 50%
              blue: 100%
              num_leds: 2
            - red: 0%
              green: 0%
              blue: 0%
              num_leds: 6
          add_led_interval: 0.08s
          reverse: false
      - addressable_scan:
          name: "Call Radar"
          move_interval: 0.1s
          scan_width: 2
      - pulse:
          name: "Speaking Pulse"
          transition_length: 0.4s
          update_interval: 0.5s
          min_brightness: 30%
          max_brightness: 100%

voice_assistant:
  id: va
  microphone: board_mic
  speaker: board_speaker
  use_wake_word: true
  micro_wake_word: my_wake_word
  volume_multiplier: 1.0
  conversation_timeout: 3600s
  on_listening:
    - light.turn_on:
        id: aura_led
        brightness: 90%
        red: 0%
        green: 75%
        blue: 100%
  on_end:
    - micro_wake_word.start:
    - light.turn_off:
        id: aura_led
  on_error:
    - micro_wake_word.start:

micro_wake_word:
  id: my_wake_word
  stop_after_detection: false
  models:
    - model: alexa
      probability_cutoff: 0.45
      sliding_window_size: 3
  microphone:
    gain_factor: 2
  on_wake_word_detected:
    - light.turn_on:
        id: aura_led
        brightness: 100%
        red: 0%
        green: 80%
        blue: 100%
    - voice_assistant.start:
        wake_word: !lambda return wake_word;
